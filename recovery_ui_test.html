<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>DevEx0 Crash Recovery Test</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'SF Mono', 'Monaco', 'Inconsolata', 'Consolas', monospace;
      background: #fff;
      color: #000;
      width: 400px;
      padding: 20px;
      letter-spacing: 0.5px;
      line-height: 1.4;
    }
    
    .header {
      font-size: 16px;
      font-weight: normal;
      margin-bottom: 20px;
      padding-bottom: 8px;
      border-bottom: 1px solid #000;
    }
    
    .domain-indicator {
      font-size: 10px;
      color: #666;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    
    button {
      font-family: inherit;
      font-size: 14px;
      padding: 12px 8px;
      border: 1px solid #000;
      border-radius: 0;
      background: #fff;
      color: #000;
      cursor: pointer;
      transition: all 0.1s;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      font-weight: normal;
    }
    
    button:hover {
      background: #000;
      color: #fff;
    }
    
    .button-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 16px;
    }
    
    .status {
      font-size: 12px;
      color: #666;
      min-height: 16px;
      padding-top: 8px;
      border-top: 1px solid #ccc;
      letter-spacing: 0.3px;
    }
    
    #crashRecovery {
      font-size: 11px; 
      margin-bottom: 12px; 
      padding: 12px; 
      border: 1px solid #ff9800; 
      background: #fff3e0; 
      border-radius: 4px;
      display: block; /* Make it visible by default for testing */
    }
    
    #processingProgress {
      margin-bottom: 16px;
      padding: 12px;
      border: 1px solid #2196F3;
      background: #e3f2fd;
      border-radius: 4px;
      font-size: 11px;
    }
    
    .progress-bar {
      height: 8px;
      background: #e0e0e0;
      border-radius: 4px;
      margin: 8px 0;
      overflow: hidden;
    }
    
    .progress-fill {
      height: 100%;
      background: #2196F3;
      width: 0%;
      transition: width 0.3s ease;
    }
    
    .activity-log {
      max-height: 100px;
      overflow-y: auto;
      margin-top: 8px;
      padding: 8px;
      background: #f5f5f5;
      border-radius: 4px;
      font-size: 10px;
      font-family: monospace;
    }
    
    .log-entry {
      margin-bottom: 4px;
      padding-bottom: 4px;
      border-bottom: 1px solid #e0e0e0;
    }
    
    .console-log {
      display: none;
    }
  </style>
</head>
<body>
  <div class="header">
    devex0
    <div id="domainIndicator" class="domain-indicator">ready</div>
  </div>
  
  <!-- Crash Recovery Banner (visible by default for testing) -->
  <div id="crashRecovery">
    <strong>🔄 Processing Recovery Available!</strong><br>
    <span id="recoveryStats">
      📄 Successfully processed <strong>1</strong> of <strong>3</strong> pages<br>
      📊 Found <strong>24</strong> total items<br>
    </span>
    <div style="margin-top: 8px;">
      <button id="copyPartialResults" style="padding: 6px 12px; font-size: 10px; background: #ff9800; color: white; border: none; border-radius: 3px; cursor: pointer;">
        📋 Copy Partial Results
      </button>
      <button id="dismissRecovery" style="padding: 6px 12px; font-size: 10px; background: #666; color: white; border: none; border-radius: 3px; cursor: pointer;">
        ❌ Dismiss
      </button>
    </div>
  </div>
  
  <!-- Status Display -->
  <div id="status" class="status">Crash recovery available - partial results found</div>
  
  <!-- Console Log Display (hidden, for testing) -->
  <div id="consoleLogContainer" style="display: none;"></div>
  
  <script>
    // Mock Chrome API for testing
    window.chrome = {
      storage: {
        local: {
          get: async function(key) {
            console.log(`[Chrome Storage] Getting ${key}`);
            const data = window.mockChromeStorage || {};
            if (typeof key === 'string') {
              return { [key]: data[key] };
            } else if (Array.isArray(key)) {
              const result = {};
              key.forEach(k => {
                result[k] = data[k];
              });
              return result;
            } else {
              return data;
            }
          },
          set: async function(obj) {
            console.log(`[Chrome Storage] Setting data`, obj);
            window.mockChromeStorage = window.mockChromeStorage || {};
            Object.assign(window.mockChromeStorage, obj);
            return true;
          },
          remove: async function(key) {
            console.log(`[Chrome Storage] Removing ${key}`);
            if (window.mockChromeStorage && window.mockChromeStorage[key]) {
              delete window.mockChromeStorage[key];
            }
            return true;
          }
        }
      }
    };
    
    // Initialize mock storage with partial results
    window.mockChromeStorage = {
      'devex0_results_12345': {
        multiPageExtraction: true,
        status: 'crashed_partial',
        summary: {
          totalPages: 3,
          successfulPages: 1,
          failedPages: 0,
          totalItems: 24,
          processingTime: 5000,
          crashedAt: 2
        },
        pages: [
          {
            success: true,
            url: 'https://www.honeybirdette.com/collections/all-lingerie?page=1',
            pageNumber: 1,
            itemCount: 24,
            selectors: ['product-card', 'product-title', 'product-price'],
            timestamp: new Date().toISOString()
          }
        ],
        metadata: {
          url: 'https://www.honeybirdette.com/collections/all-lingerie',
          timestamp: new Date().toISOString(),
          paginationPattern: {
            success: true,
            pattern: 'https://www.honeybirdette.com/collections/all-lingerie?page={PAGE}',
            increment: 1,
            startValue: 1
          },
          paginationStats: {
            totalPages: 10,
            currentPage: 1,
            itemsPerPage: 24,
            hasPagination: true
          },
          crashReason: 'Extension context lost during navigation'
        }
      }
    };
    
    // Mock clipboard API
    window.lastClipboardContent = '';
    navigator.clipboard = {
      writeText: async function(text) {
        console.log(`[Clipboard] Copying text: ${text.substring(0, 50)}...`);
        window.lastClipboardContent = text;
        return true;
      }
    };
    
    // Custom console.log to display in UI
    const originalConsoleLog = console.log;
    const originalConsoleWarn = console.warn;
    const originalConsoleError = console.error;
    
    console.log = function() {
      originalConsoleLog.apply(console, arguments);
      const logContainer = document.getElementById('consoleLogContainer');
      const logEntry = document.createElement('div');
      logEntry.className = 'console-log';
      logEntry.textContent = Array.from(arguments).join(' ');
      logContainer.appendChild(logEntry);
    };
    
    console.warn = function() {
      originalConsoleWarn.apply(console, arguments);
      const logContainer = document.getElementById('consoleLogContainer');
      const logEntry = document.createElement('div');
      logEntry.className = 'console-log';
      logEntry.textContent = '[WARN] ' + Array.from(arguments).join(' ');
      logContainer.appendChild(logEntry);
    };
    
    console.error = function() {
      originalConsoleError.apply(console, arguments);
      const logContainer = document.getElementById('consoleLogContainer');
      const logEntry = document.createElement('div');
      logEntry.className = 'console-log';
      logEntry.textContent = '[ERROR] ' + Array.from(arguments).join(' ');
      logContainer.appendChild(logEntry);
    };
    
    // Add event listeners for recovery buttons
    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('copyPartialResults').addEventListener('click', async () => {
        const partialResults = window.mockChromeStorage['devex0_results_12345'];
        await navigator.clipboard.writeText(JSON.stringify(partialResults, null, 2));
        document.getElementById('status').textContent = 'Partial results copied to clipboard';
      });
      
      document.getElementById('dismissRecovery').addEventListener('click', async () => {
        // Clear recovery data
        delete window.mockChromeStorage['devex0_results_12345'];
        document.getElementById('crashRecovery').style.display = 'none';
        document.getElementById('status').textContent = 'Recovery dismissed';
      });
    });
  </script>
</body>
</html>
