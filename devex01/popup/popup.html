<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>devex0</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'SF Mono', 'Monaco', 'Inconsolata', 'Consolas', monospace;
      background: #fff;
      color: #000;
      width: 260px;
      padding: 20px;
      letter-spacing: 0.5px;
      line-height: 1.4;
    }
    
    .header {
      font-size: 16px;
      font-weight: normal;
      margin-bottom: 20px;
      padding-bottom: 8px;
      border-bottom: 1px solid #000;
    }
    
    .domain-indicator {
      font-size: 10px;
      color: #666;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    
    label {
      display: block;
      font-size: 12px;
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    
    input, select {
      width: 100%;
      font-family: inherit;
      font-size: 14px;
      padding: 8px;
      margin-bottom: 12px;
      border: 1px solid #000;
      border-radius: 0;
      background: #fff;
      color: #000;
      outline: none;
      letter-spacing: 0.5px;
    }
    
    input:focus, select:focus {
      background: #000;
      color: #fff;
    }
    
    input::placeholder {
      color: #666;
      font-style: italic;
    }
    
    .button-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 16px;
    }
    
    button {
      font-family: inherit;
      font-size: 14px;
      padding: 12px 8px;
      border: 1px solid #000;
      border-radius: 0;
      background: #fff;
      color: #000;
      cursor: pointer;
      transition: all 0.1s;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      font-weight: normal;
    }
    
    button:hover {
      background: #000;
      color: #fff;
    }
    
    button:active {
      transform: scale(0.98);
    }
    
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      background: #fff;
      color: #000;
    }
    
    .status {
      font-size: 12px;
      color: #666;
      min-height: 16px;
      padding-top: 8px;
      border-top: 1px solid #ccc;
      letter-spacing: 0.3px;
    }
    
    .status.active {
      color: #000;
    }
    
    .status.error {
      color: #000;
      background: #fff;
      border: 1px solid #000;
      padding: 4px 8px;
      margin-top: 4px;
    }
    
    select option {
      background: #fff;
      color: #000;
      font-family: inherit;
    }
    
    /* Loading state */
    .loading {
      position: relative;
      overflow: hidden;
    }
    
    .loading::after {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(0,0,0,0.1), transparent);
      animation: loading 1s infinite;
    }
    
    @keyframes loading {
      0% { left: -100%; }
      100% { left: 100%; }
    }
    
    /* Reconnaissance specific styles */
    .target-item {
      padding: 12px;
      border-bottom: 1px solid #eee;
      cursor: pointer;
      font-size: 11px;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      transition: background-color 0.2s ease;
    }
    
    .target-item:hover {
      background: #f5f5f5;
    }
    
    .target-item.selected {
      background: #e3f2fd;
      border-left: 3px solid #2196F3;
    }
    
    .target-name {
      font-weight: normal;
      margin-bottom: 4px;
      line-height: 1.3;
    }
    
    .target-details {
      color: #666;
      font-size: 10px;
      line-height: 1.4;
    }
    
    .target-score {
      background: #000;
      color: #fff;
      padding: 4px 8px;
      border-radius: 3px;
      font-size: 10px;
      min-width: 30px;
      text-align: center;
      font-weight: bold;
      flex-shrink: 0;
      margin-left: 12px;
    }
    
    .target-item.selected .target-score {
      background: #2196F3;
      color: #fff;
    }
    
    .recon-phase {
      font-size: 10px;
      color: #000;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 8px;
      padding: 4px 0;
      border-bottom: 1px solid #000;
    }
    
    .target-checkbox {
      margin-right: 8px;
    }
    
    .collapsible {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.3s ease-out;
    }
    
    .collapsible.expanded {
      max-height: 300px;
    }
    
    /* Current URL display styles */
    .current-url-display {
      font-size: 11px;
      color: #666;
      margin-bottom: 8px;
      padding: 6px 8px;
      border: 1px solid #ccc;
      background: #f9f9f9;
      word-break: break-all;
      line-height: 1.3;
    }
    
    .current-url-display .url-label {
      font-weight: bold;
      margin-bottom: 3px;
      color: #000;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-size: 10px;
    }
    
    .current-url-display .url-value {
      font-family: inherit;
      font-size: 11px;
      color: #333;
    }
    
    .current-url-display button {
      font-size: 9px;
      padding: 2px 6px;
      margin-top: 4px;
      border: 1px solid #666;
      background: #fff;
      color: #666;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    
    .current-url-display button:hover {
      background: #666;
      color: #fff;
    }
  </style>
</head>
<body>
  <div class="header">
    devex0
    <div id="domainIndicator" class="domain-indicator">ready</div>
  </div>


  <!-- Simplified devex0 Workflow -->
  <div id="extractMode">
    <!-- Current URL Display -->
    <div class="current-url-display" id="urlDisplay" style="display: none;">
      <div class="url-label">Current Page</div>
      <div class="url-value" id="currentUrl"></div>
    </div>

    <!-- Main Extract Button -->
    <button id="extract" style="width: 100%; margin-bottom: 12px; font-size: 16px; padding: 16px;">
      EXTRACT
    </button>

    <!-- Insight Options (Hidden initially) -->
    <div id="insightOptions" style="display: none;">
      <div class="recon-phase">Want insights on extracted data?</div>
      <div class="button-row">
        <button id="showInsights">yes, analyze</button>
        <button id="skipInsights">no, done</button>
        <button id="createGoogleSheet" style="background: #4285f4; color: white; margin-top: 8px; width: 100%;">
          📊 Create Google Sheet
        </button>
      </div>
    </div>

    <!-- Asset Analysis Results (Hidden initially) -->
    <div id="analysisResults" style="display: none;">
      <div class="recon-phase">Asset Analysis Complete</div>
      
      <!-- Analysis Summary -->
      <div id="analysisSummary" style="font-size: 11px; margin-bottom: 12px; padding: 8px; border: 1px solid #ccc; background: #f9f9f9;">
        <!-- Summary will be populated by JavaScript -->
      </div>

      <!-- Top Selectors List -->
      <div id="selectorsList" style="max-height: 400px; overflow-y: auto; margin-bottom: 12px; border: 1px solid #ccc; border-radius: 4px;">
        <!-- Selectors will be populated by JavaScript -->
      </div>

      <!-- Selection Controls -->
      <div class="button-row" style="margin-bottom: 8px;">
        <button id="selectAll" style="background: #2196F3; color: white;">Select All</button>
        <button id="clearSelection" style="background: #ff9800; color: white;">Clear All</button>
      </div>

      <!-- Actions -->
      <div class="button-row">
        <button id="exass">exass</button>
        <button id="reset" style="background: #666;">Reset</button>
        <button id="createAnalysisSheet" style="background: #4285f4; color: white; margin-top: 8px; width: 100%;">
          📊 Save to Google Sheets
        </button>
      </div>
    </div>
  </div>

  <!-- Status Display -->
  <div id="status" class="status">ready</div>

  <!-- Google Sheets Status (Hidden initially) -->
  <div id="googleSheetsStatus" style="display: none; margin-top: 12px; padding: 12px; border: 1px solid #4285f4; border-radius: 4px; background: #f0f8ff;">
    <div id="sheetsStatusMessage">Processing...</div>
    <div id="sheetsUrl" style="margin-top: 8px; display: none;">
      <a href="#" target="_blank" style="color: #4285f4; text-decoration: none;">
        🔗 Open Google Sheet
      </a>
    </div>
  </div>

  <script src="../utils/google-sheets-integration.js"></script>
  <script src="../utils/extraction-analyzer.js"></script>
  <script src="popup.js"></script>
</body>
</html>
